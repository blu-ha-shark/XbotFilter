<!DOCTYPE html>
<html lang="zh-Hant" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XbotFilter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="notranslate">
  <header>
    <div class="header-top">
      <h1>XbotFilter</h1>
      <button
        type="button"
        id="themeBtn"
        class="theme-btn"
        aria-label="切換黑暗模式"
        aria-pressed="false"
        title="黑暗模式"
      >
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12.1 2a9.9 9.9 0 0 0-1.4.1 8 8 0 1 0 11.2 11.2A10 10 0 0 1 12.1 2z"
          />
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0-5h1v3h-2V2zm0 17h1v3h-2v-3zM2 11h3v2H2v-2zm17 0h3v2h-3v-2zM4.2 4.2l2.1 2.1-1.4 1.4-2.1-2.1 1.4-1.4zm14.1 0 1.4 1.4-2.1 2.1-1.4-1.4 2.1-2.1zM5.9 16.3l1.4 1.4-2.1 2.1-1.4-1.4 2.1-2.1zm11.7 0 2.1 2.1-1.4 1.4-2.1-2.1 1.4-1.4z"
          />
        </svg>
      </button>
    </div>
    <p class="subtitle">自訂關鍵字隱藏機器人貼文</p>
  </header>

  <section class="toggle-group">
    <div class="toggle-row">
      <span class="toggle-label">啟用過濾</span>
      <label class="switch" for="enabled">
        <input type="checkbox" id="enabled" checked />
        <span class="slider" aria-hidden="true"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">關鍵字選中</span>
      <label class="switch" for="markSelected">
        <input type="checkbox" id="markSelected" />
        <span class="slider" aria-hidden="true"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">文字複製模式</span>
      <label class="switch" for="copyMode">
        <input type="checkbox" id="copyMode" />
        <span class="slider" aria-hidden="true"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">創作者管理捷徑</span>
      <label class="switch" for="creatorModeEnabled">
        <input type="checkbox" id="creatorModeEnabled" />
        <span class="slider" aria-hidden="true"></span>
      </label>
    </div>
  </section>

  <section class="keyword-tabs">
    <div class="tab-bar" role="tablist">
      <button
        type="button"
        class="tab-btn active"
        role="tab"
        id="tabContentBtn"
        data-tab="content"
        aria-selected="true"
      >
        貼文內容過濾
      </button>
      <button
        type="button"
        class="tab-btn"
        role="tab"
        id="tabUsernameBtn"
        data-tab="username"
        aria-selected="false"
      >
        使用者名稱過濾
      </button>
    </div>

    <div
      class="tab-panel active"
      id="contentTab"
      role="tabpanel"
      data-tab="content"
    >
      <div class="add-row">
        <input
          type="text"
          id="contentKeywordInput"
          placeholder="例如：免費領取"
          autocomplete="off"
        />
        <button type="button" id="contentAddBtn">新增</button>
      </div>
      <div class="keyword-list-shell">
        <ul id="contentKeywordList" class="keyword-list"></ul>
        <p id="contentEmptyHint" class="empty-hint">尚未設定關鍵字</p>
      </div>
    </div>

    <div
      class="tab-panel"
      id="usernameTab"
      role="tabpanel"
      data-tab="username"
    >
      <div class="add-row">
        <input
          type="text"
          id="usernameKeywordInput"
          placeholder="例如：bot123 或 @spam"
          autocomplete="off"
        />
        <button type="button" id="usernameAddBtn">新增</button>
      </div>
      <div class="keyword-list-shell">
        <ul id="usernameKeywordList" class="keyword-list"></ul>
        <p id="usernameEmptyHint" class="empty-hint">尚未設定關鍵字</p>
      </div>
    </div>
  </section>

  <footer>
    <button type="button" id="exportBtn" class="secondary">匯出</button>
    <button type="button" id="importBtn" class="secondary">匯入</button>
    <input type="file" id="importFile" accept=".txt,.json" hidden />
  </footer>

  <script src="popup.js"></script>
</body>
</html>
